name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          mkdir -p extracted
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR="$(dirname "$(find extracted -name pubspec.yaml -print -quit)")"

          if [ -z "$PROJECT_DIR" ]; then
            echo "pubspec.yaml not found inside ZIP"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Android project
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi

      - name: Get packages
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nahda-dz-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
